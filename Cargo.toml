# tether: a small host that owns pseudo-terminals, so a program running in one can be typed
# into, read and watched by any application, while terminal windows attach and detach. One
# workspace: the wire protocol, the session core, the host, a Rust client and the `tether`
# binary. Nothing here knows which program runs in a terminal or which application drives it.

[workspace]
resolver = "2"
members = ["crates/proto", "crates/core", "crates/server", "crates/client", "crates/cli", "crates/testtui"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/FeritMelih/tether"
authors = ["feritmelih"]

[workspace.dependencies]
tether-proto = { path = "crates/proto", version = "0.2.0" }
tether-core = { path = "crates/core", version = "0.2.0" }
tether-server = { path = "crates/server", version = "0.2.0" }
tether-client = { path = "crates/client", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }
clap = { version = "4.5", features = ["derive"] }
# Pinned: its Windows half is to be forked (a safe DLL load path, configurable ConPTY flags,
# a close that cannot block), and a release that moves under the fork must not slip in.
portable-pty = "=0.9.0"
vt100 = "0.16"
libc = "0.2"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
